version: '3.8'

services:
  mock-agent-1:
    build: ./mock-agent
    environment:
      - AGENT_ID=mock-agent-1
      - PORT=8080
    ports:
      - "8081:8080"
    networks:
      - test-network

  mock-agent-2:
    build: ./mock-agent
    environment:
      - AGENT_ID=mock-agent-2
      - PORT=8080
    ports:
      - "8082:8080"
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
