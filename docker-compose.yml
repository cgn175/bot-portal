version: '3.8'

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-portal
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/db/portal.db
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AGENT_CONFIG_DIR=/app/agent-configs
      - AGENT_CONFIG_DIR_HOST=${PWD}/agent-configs
      - ENCRYPTION_KEY=7efc6f9f246692c44bc77b52404ba940
      - SHARED_VOLUME_HOST_PATH=${SHARED_VOLUME_HOST_PATH:-}
    volumes:
      - ./db:/app/db
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agent-configs:/app/agent-configs
    restart: unless-stopped
    networks:
      - bot-portal-network

  copilot-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: copilot-sidecar
    ports:
      - "3001:3001"
    environment:
      - COPILOT_PORT=3001
      - BACKEND_URL=http://portal:8080
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - portal
    restart: unless-stopped
    networks:
      - bot-portal-network

networks:
  bot-portal-network:
    driver: bridge
